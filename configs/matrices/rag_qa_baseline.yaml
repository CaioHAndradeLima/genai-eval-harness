name: rag-qa-baseline
description: >
  Starter matrix comparing retrieval strategies on a small MLflow documentation
  Q&A golden set. Used in Phase 1 validation; runner executes in Phase 3.
baseline: bm25-only

variants:
  - name: bm25-only
    task: rag
    model:
      provider: openai
      name: gpt-4o-mini
      temperature: 0.0
      max_tokens: 512
    prompt:
      path: prompts/rag/qa_v1.jinja
      version: v1
    retriever:
      type: bm25
      corpus_path: data/corpus/mlflow_docs.txt
      chunk_size: 512
      chunk_overlap: 64
      top_k: 5
      rerank: false
    data:
      path: datasets/rag/mlflow_qa.json
      name: mlflow-qa
      version: "0.1.0"
    scorers:
      retrieval:
        - recall_at_k
        - mrr
      generation:
        - exact_match
        - faithfulness
      ops:
        - latency_ms
        - token_count

  - name: hybrid-rerank
    task: rag
    model:
      provider: openai
      name: gpt-4o-mini
      temperature: 0.0
      max_tokens: 512
    prompt:
      path: prompts/rag/qa_v2.jinja
      version: v2
    retriever:
      type: hybrid
      corpus_path: data/corpus/mlflow_docs.txt
      chunk_size: 512
      chunk_overlap: 64
      top_k: 10
      rerank: true
      embedding_model: text-embedding-3-small
    data:
      path: datasets/rag/mlflow_qa.json
      name: mlflow-qa
      version: "0.1.0"
    scorers:
      retrieval:
        - recall_at_k
        - mrr
        - ndcg
      generation:
        - exact_match
        - faithfulness
        - answer_relevance
      ops:
        - latency_ms
        - token_count
